<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zero Euro Collection</title><link rel="stylesheet" href="style.css?v=1"><script src="app.js?v=1" defer></script></head>
<body>
<header class="site-header"><div class="brand"><div class="brand-mark banknote-avatar" role="img" aria-label="Zero Euro banknote"></div><h1>Zero Euro Collection</h1></div><div class="header-actions"><nav class="collection-links" aria-label="Collections"><a class="secondary-btn euro-link" href="https://coins-mp.github.io/">Euro Coins</a><a class="secondary-btn world-link" href="https://coins-mp.github.io/world-coin-collection/">World Coins</a><a class="secondary-btn selected" href="./" aria-current="page">Zero Euro</a></nav><button class="secondary-btn" id="themeToggle">🌙 Dark</button><button class="secondary-btn" id="viewToggle">▦ Table</button></div></header>
<main class="page-shell"><div class="local-strip" id="localStrip" hidden><span id="pendingCount">Local mode</span><a class="secondary-btn" href="admin/">Open Admin</a></div>
<button type="button" class="collection-banner" id="collectionBanner"><span class="banner-art" id="bannerArt">0 €</span><span><strong>Zero Euro Collection</strong><span id="totalCount">Loading…</span></span></button>
<section class="filters-panel" aria-label="Banknote filters"><div class="filter-group"><label for="countryFilter">Country</label><select id="countryFilter"><option value="">All countries</option></select></div><div class="filter-group"><label for="yearFilter">Year</label><select id="yearFilter"><option value="">All years</option></select></div><div class="filter-group"><label for="statusFilter">Status</label><select id="statusFilter"><option value="">All statuses</option><option>Collection</option><option>Missing</option><option>Duplicate</option></select></div><div class="filter-group"><label for="sortFilter">Sort by</label><select id="sortFilter"><option value="country">Country A–Z</option><option value="newest">Year: newest first</option><option value="oldest">Year: oldest first</option><option value="name">Name A–Z</option></select></div><div class="filter-group search-group"><label for="searchInput">Search</label><div class="search-controls"><input type="search" id="searchInput" placeholder="Country, banknote name, year, issue code…"><button class="secondary-btn" id="resetFilters">Reset filters</button></div></div></section>
<section class="section-heading" id="results"><h2>Zero Euro Collection</h2><p id="resultCount" aria-live="polite"></p></section><p class="empty-state" id="message" hidden></p><section class="note-grid" id="noteGrid" aria-label="Banknotes"></section><div class="table-wrap" id="tableWrap" hidden><table><caption class="sr-only">Zero Euro collection</caption><thead><tr><th>Country</th><th>Banknote</th><th>Year</th><th>Issue code</th><th>Status</th></tr></thead><tbody id="tableBody"></tbody></table></div></main>
<dialog id="noteDialog" class="note-dialog"><button class="close-button" id="closeNote" aria-label="Close banknote">×</button><div class="note-layout"><div class="note-left"><div id="noteImages" class="note-images"></div><div class="note-pagination"><button class="note-nav-button" id="previousNote"><strong>← Previous</strong><span id="previousLabel"></span></button><span id="notePosition"></span><button class="note-nav-button" id="nextNote"><strong>Next →</strong><span id="nextLabel"></span></button></div></div><div class="note-right"><div class="note-summary" id="noteSummary"></div><section class="description-scroll" id="descriptionScroll" tabindex="0" aria-label="Banknote details and description"><div class="detail-grid" id="noteDetails"></div><h3>Description</h3><div id="noteDescription"></div><div id="noteNotes"></div></section></div></div></dialog>
<dialog id="zoomDialog" class="zoom-dialog"><button class="close-button" id="closeZoom" aria-label="Close image">×</button><img id="zoomImage" alt=""></dialog>
<footer><a class="euro-link" href="https://coins-mp.github.io/">Euro Coins</a><span>·</span><a class="world-link" href="https://coins-mp.github.io/world-coin-collection/">World Coins</a><span>·</span><a href="./">Zero Euro</a></footer></body></html>
